# PHP CircleCI 2.0 configuration file
#
# Check https://circleci.com/docs/2.0/language-php/ for more details
#
version: 2

test: &test
  steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-test-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}
          # fallback to using the latest cache if no exact match is found
          - v2-test-dependencies-

      - run: apt update && apt install -y libpng-dev git unzip && docker-php-ext-install gd

      - run: |
          EXPECTED_SIGNATURE=$(curl -L https://composer.github.io/installer.sig)
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          ACTUAL_SIGNATURE=$(php -r "echo hash_file('SHA384', 'composer-setup.php');")

          if [ "$EXPECTED_SIGNATURE" != "$ACTUAL_SIGNATURE" ]
          then
              >&2 echo 'ERROR: Invalid installer signature'
              rm composer-setup.php
              exit 1
          fi

          php composer-setup.php --quiet --install-dir /usr/local/bin --filename composer

      - run: composer update -n --prefer-dist $COMPOSER_FLAGS

      - save_cache:
          paths:
            - /root/.composer/cache/files
          key: v2-test-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}

      # run tests!
      - run: |
          mkdir -p build/logs
          vendor/bin/phpunit --testsuite Unit

      - store_test_results:
          path: build/logs

test_and_cover: &test_and_cover
  steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-test-cover-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}
          # fallback to using the latest cache if no exact match is found
          - v2-test-cover-dependencies-

      - run: apt update && apt install -y libpng-dev git unzip && docker-php-ext-install gd

      - run: |
          EXPECTED_SIGNATURE=$(curl -L https://composer.github.io/installer.sig)
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          ACTUAL_SIGNATURE=$(php -r "echo hash_file('SHA384', 'composer-setup.php');")

          if [ "$EXPECTED_SIGNATURE" != "$ACTUAL_SIGNATURE" ]
          then
              >&2 echo 'ERROR: Invalid installer signature'
              rm composer-setup.php
              exit 1
          fi

          php composer-setup.php --quiet --install-dir /usr/local/bin --filename composer

      - run: composer update -n --prefer-dist

      # docker-php-ext-enable resolves extension_dir itself. The previous
      # version hard-coded the PHP 8.0 extension API directory
      # (no-debug-non-zts-20200930), so xdebug silently failed to load on any
      # other PHP version and no coverage was collected.
      - run:
          name: Install xdebug for coverage
          command: |
            php -m | grep -qi xdebug || pecl install xdebug
            docker-php-ext-enable xdebug
            echo 'xdebug.mode=coverage' > /usr/local/etc/php/conf.d/xdebug-mode.ini

      - save_cache:
          paths:
            - /root/.composer/cache/files
          key: v2-test-cover-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}

      # run tests!
      - run: |
          mkdir -p build/logs
          vendor/bin/phpunit --testsuite Unit

      - store_test_results:
          path: build/logs

      # Coverage was uploaded to Code Climate, whose test-reporter download now
      # returns 404 -- the shell was executing an HTML error page, which is why
      # this job has failed on every run since 2026-07-13. Keep the clover
      # report as an artifact instead. The upload also passed the exit status of
      # apt-get rather than phpunit, and read test-results/clover.xml while
      # phpunit.xml.dist writes build/logs/clover.xml, so it had not reported
      # anything meaningful for some time.
      - store_artifacts:
          path: build/logs
          destination: coverage

code_fixer: &code_fixer
  steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
          - v2-test-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}
          # fallback to using the latest cache if no exact match is found
          - v2-test-dependencies-

      - run: apt update && apt install -y libpng-dev git unzip && docker-php-ext-install gd

      - run: |
          EXPECTED_SIGNATURE=$(curl -L https://composer.github.io/installer.sig)
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          ACTUAL_SIGNATURE=$(php -r "echo hash_file('SHA384', 'composer-setup.php');")

          if [ "$EXPECTED_SIGNATURE" != "$ACTUAL_SIGNATURE" ]
          then
              >&2 echo 'ERROR: Invalid installer signature'
              rm composer-setup.php
              exit 1
          fi

          php composer-setup.php --quiet --install-dir /usr/local/bin --filename composer

      - run: composer update -n --prefer-dist

      - save_cache:
          paths:
            - /root/.composer/cache/files
          key: v2-test-dependencies-{{ .Environment.CIRCLE_JOB }}-{{ checksum "composer.json" }}-{{ checksum ".circleci/config.yml" }}

      # run tests!
      # installed_paths is registered by dealerdirect/phpcodesniffer-composer-installer,
      # which also covers the standards drupal/coder now depends on
      # (slevomat/coding-standard, phpcs-variable-analysis). Setting it by hand
      # to only coder's path makes those sniffs unresolvable.
      - run: vendor/bin/phpcs -i
      - run: vendor/bin/phpcs --standard=Drupal -- src tests

jobs:
  # Highest dependencies on the minimum supported PHP. Resolves to Drupal 11,
  # Symfony Lock 7 and PHPUnit 11.
  build:
    docker:
      - image: php:8.3
    working_directory: ~/repo
    <<: *test_and_cover

  # Lowest dependencies. Resolves to Drupal 10, Symfony Lock 6.0 and PHPUnit 9,
  # which is the other end of every declared constraint.
  build_lowest:
    docker:
      - image: php:8.3
    working_directory: ~/repo
    environment:
      - COMPOSER_FLAGS: --prefer-lowest
    <<: *test

  build_php84:
    docker:
      - image: php:8.4
    working_directory: ~/repo
    <<: *test

  code_fixer:
    docker:
      - image: php:8.3

    working_directory: ~/repo

    <<: *code_fixer

workflows:
  version: 2

  # Declare a workflow that runs all of our jobs in parallel.
  test_cover_workflow:
    jobs:
      - build
      - build_lowest
      - build_php84
      - code_fixer

  nightly:
    triggers:
      - schedule:
          # Run jobs every Monday morning at 12AM
          cron: "0 0 * * 1"
          filters:
            branches:
              only:
                - main
    jobs:
      - build
      - code_fixer
